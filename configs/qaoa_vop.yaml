# QAOA MaxCut: VoP (variational-output) hypernet with prototype-prior KL

phases:
  phase1:
    task: qaoa_vop
    config:
      phase: phase1

      n: 10                 # number of vertices
      p: 6                  # QAOA depth (layers)
      seed: 2025
      device: cuda
      weighted: uniform
      p_range: [0.1, 0.9]
      num_graphs: 128
      train_ratio: 0.8
      batch_size: 16

      # ----- Optim / Train -----
      learning_rate: 1e-3
      epoch: 30

      # ----- Prototype-prior KL -----
      use_proto_prior: true
      K: 7
      prior_sigma0: 0.1
      beta: 0.05

  phase2:
    task: qaoa_vop
    config:
      phase: phase2

      n: 10
      p: 6
      seed: 2025
      device: cuda

      checkpoint_path: null     # ex) results/qaoa_vop_pretrain_n14_p16/seed2025/best.pt

      learning_rate: 1e-3
      num: 16
      step_per_point: 2000

      output_dir: pergraph_runs_test_set